name: build and deploy firebase hosting

on:
  push:
    branches:
      - sample

env:
  ACTIONS_LOCK_FILE: pnpm-lock.yaml
  # Cloud Functionsの静的ファイル配信先ディレクトリ名。
  # scripts/prepare-firebase-deploy.js の移動先と、
  # packages/functions/src/module/webApp.ts(firebase-functions paramsのdefineString経由)
  # の読み込み元で一致している必要がある。
  FUNCTIONS_PUBLIC_DIR_NAME: public

  # 以下はダミー値。実際にデプロイする際は対象のFirebaseプロジェクトの値に書き換える
  # （値は packages/web/src/common/firebaseConfig.ts が参照する）。
  NEXT_PUBLIC_FIREBASE_API_KEY: dummy-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: hinagata-next-dev.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://hinagata-next-dev-default-rtdb.firebaseio.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: hinagata-next-dev
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: hinagata-next-dev.firebasestorage.app
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles(format('**/{0}', env.ACTIONS_LOCK_FILE)) }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: install dependencies
        run: pnpm install

      - name: write firebase functions params
        run: echo "FUNCTIONS_PUBLIC_DIR_NAME=${{ env.FUNCTIONS_PUBLIC_DIR_NAME }}" > packages/functions/.env.${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}

      - name: firebase deploy
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: pnpm exec firebase deploy --only hosting,functions --project ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }} --force
