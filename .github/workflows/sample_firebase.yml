name: build and deploy firebase hosting

on:
  push:
    branches:
      - sample

env:
  ACTIONS_LOCK_FILE: pnpm-lock.yaml
  # web(Next.js)のエクスポート先とfunctionsの静的配信先のディレクトリ名。
  # packages/web/scripts/make-dist-dir.ts, scripts/prepare-firebase-deploy.js,
  # packages/functions/src/module/webApp.ts(firebase-functions paramsのdefineString経由)
  # の3箇所で一致している必要がある。
  WEB_DIST_DIR_NAME: dist
  FUNCTIONS_PUBLIC_DIR_NAME: public

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles(format('**/{0}', env.ACTIONS_LOCK_FILE)) }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: install dependencies
        run: pnpm install

      - name: write firebase functions params
        run: echo "FUNCTIONS_PUBLIC_DIR_NAME=${{ env.FUNCTIONS_PUBLIC_DIR_NAME }}" > packages/functions/.env.${{ secrets.FIREBASE_PROJECT_ID }}

      - name: firebase deploy
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: pnpm exec firebase deploy --only hosting,functions --project ${{ secrets.FIREBASE_PROJECT_ID }} --force
